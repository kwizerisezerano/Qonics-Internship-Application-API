openapi: 3.0.0
info:
  title: Qonics Internship Application API
  description: API for Qonics internship application management
  version: 1.0.0
  contact:
    name: Qonics API Support
    email: internships@qonics.com

servers:
  - url: http://localhost:8080
    description: Local development (KrakenD Gateway)
  - url: https://your-production-url.ondigitalocean.app
    description: Production (DigitalOcean App Platform)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number (default 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page (default 10, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SearchParam:
      name: search
      in: query
      required: false
      description: >-
        Cross-column search. Plain columns match case-insensitively (contains);
        encrypted PII columns (name/email) match on the SHA-256 hash, so those
        require the exact value.
      schema:
        type: string

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [applicant, admin]

    Session:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string

    ApplicantProfile:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        institution:
          type: string
        field_of_study:
          type: string
        qualification:
          type: string
        academic_status:
          type: string
        graduation_year:
          type: integer
        skills:
          type: array
          items:
            type: string
        bio:
          type: string
        github_url:
          type: string
          format: uri
        linkedin_url:
          type: string
          format: uri
        portfolio_url:
          type: string
          format: uri

    Application:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        department:
          type: string
        specialization:
          type: string
        motivation:
          type: string
        experience:
          type: string
        start_date:
          type: string
          format: date-time
        education_level:
          type: string
        session:
          type: string
        duration_months:
          type: integer
        work_mode:
          type: string
        amount:
          type: number
          nullable: true
          description: Calculated by the backend from the course and period price (default 200000 x duration_months); a client-sent amount is ignored.
        status:
          type: string
          enum: [submitted, under_review, shortlisted, interview, accepted, rejected]
        submitted_at:
          type: string
          format: date-time
        interview_at:
          type: string
          format: date-time
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationHistory'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationNote'

    Price:
      type: object
      required: [department, specialization, duration_months, price]
      properties:
        id:
          type: integer
          readOnly: true
        department:
          type: string
          enum: [software, iot]
        specialization:
          type: string
          example: backend
        duration_months:
          type: integer
          minimum: 1
          maximum: 12
          example: 3
        price:
          type: number
          minimum: 0
          description: Total price for the period.
          example: 450000
        currency:
          type: string
          example: RWF

    ApplicationHistory:
      type: object
      properties:
        status:
          type: string
        at:
          type: string
          format: date-time
        note:
          type: string

    ApplicationNote:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        text:
          type: string
        at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        at:
          type: string
          format: date-time
        read:
          type: boolean

    ActivityLog:
      type: object
      description: A single audit-trail entry recorded for a write action
      properties:
        id:
          type: integer
        activity_type:
          type: string
          description: e.g. APPLICATION_SUBMIT, SETTINGS_UPDATE
        status:
          type: string
          enum: [success, failure]
        description:
          type: string
        user_id:
          type: integer
          nullable: true
          description: Acting user id (null for system/anonymous actions)
        username:
          type: string
          description: Decrypted full name of the acting user
        email:
          type: string
          format: email
          description: Decrypted email of the acting user
        role:
          type: string
          enum: [applicant, admin]
        ip_address:
          type: string
        user_agent:
          type: string
        extra:
          type: string
          description: JSON-encoded extra metadata
        created_at:
          type: string
          format: date-time

    Booking:
      type: object
      properties:
        session:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        capacity:
          type: integer
        booked:
          type: integer
        available:
          type: integer

    PaginationMeta:
      type: object
      description: Standard leazi-style pagination metadata
      properties:
        total:
          type: integer
          description: Total matching rows across all pages
        per_page:
          type: integer
        current:
          type: integer
        pages:
          type: integer
        next:
          type: integer
          nullable: true
        prev:
          type: integer
          nullable: true

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Session'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register user
      description: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - password
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Session'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applicant/profile:
    get:
      tags:
        - Applicant
      summary: Get profile
      description: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApplicantProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Applicant
      summary: Update profile
      description: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantProfile'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApplicantProfile'

  /notifications:
    get:
      tags:
        - Notifications
      summary: Get notifications
      description: Get user's notifications (paginated, most recent first)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: read
          in: query
          required: false
          description: Filter by read state
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /notifications/read:
    post:
      tags:
        - Notifications
      summary: Mark notifications as read
      description: Mark notifications as read
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/mine:
    get:
      tags:
        - Applications
      summary: Get my applications
      description: Get current user's applications (paginated, most recent first)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: reference
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, under_review, shortlisted, interview, accepted, rejected]
        - name: submitted_from
          in: query
          required: false
          description: Lower bound on submitted_at (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
        - name: submitted_to
          in: query
          required: false
          description: Upper bound on submitted_at (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
      responses:
        '200':
          description: Applications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items:
                          $ref: '#/components/schemas/Application'
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                          submitted:
                            type: integer
                          under_review:
                            type: integer
                          shortlisted:
                            type: integer
                          interview:
                            type: integer
                          accepted:
                            type: integer
                          rejected:
                            type: integer
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /applications:
    get:
      tags:
        - Applications
      summary: Get all applications
      description: >-
        Get all applications (admin only), paginated most-recent-first, with
        dashboard aggregates computed over the filtered set.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: reference
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, under_review, shortlisted, interview, accepted, rejected]
        - name: submitted_from
          in: query
          required: false
          description: Lower bound on submitted_at (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
        - name: submitted_to
          in: query
          required: false
          description: Upper bound on submitted_at (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
      responses:
        '200':
          description: Applications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items:
                          $ref: '#/components/schemas/Application'
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                          submitted:
                            type: integer
                          under_review:
                            type: integer
                          shortlisted:
                            type: integer
                          interview:
                            type: integer
                          accepted:
                            type: integer
                          rejected:
                            type: integer
                      by_department:
                        type: array
                        items:
                          type: object
                          properties:
                            department:
                              type: string
                            count:
                              type: integer
                      by_specialization:
                        type: array
                        description: Application counts per department and specialization.
                        items:
                          type: object
                          properties:
                            department:
                              type: string
                            specialization:
                              type: string
                            count:
                              type: integer
                      trends:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                            count:
                              type: integer
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Applications
      summary: Create application
      description: |
        Create a new application. Open to guests: without a bearer token the body
        must also carry `full_name`, `email` and `phone`; the account is created
        immediately and an email with a link to set a password is sent so the
        applicant can open the portal later. If the email already has an account
        the call answers 409 and asks them to log in. Logged-in applicants apply
        under their own account as before.

        Guests can attach documents: upload each file first with
        `POST /files/guest/presigned-url` (no token needed; the first response
        returns a `guest_token`, send it back with later uploads, max 5 files),
        PUT the file to the returned URL, confirm it with
        `POST /files/guest/confirm-upload` (`file_id` + `guest_token`), then send
        the confirmed `document_ids` together with the same `guest_token` here.
        Unclaimed uploads are deleted after 24 hours.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - payload
              properties:
                payload:
                  type: string
                  format: binary
                cv:
                  type: string
                  format: binary
                cover_letter:
                  type: string
                  format: binary
                transcript:
                  type: string
                  format: binary
                portfolio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Application'

  /applications/{id}:
    get:
      tags:
        - Applications
      summary: Get application
      description: Get application by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Application'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{id}/status:
    patch:
      tags:
        - Applications
      summary: Update status
      description: Update application status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [submitted, under_review, shortlisted, interview, accepted, rejected]
                note:
                  type: string
                interview_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Application'

  /applications/{id}/notes:
    post:
      tags:
        - Applications
      summary: Add note
      description: Add a note to application (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Note added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Application'

  /applicants:
    get:
      tags:
        - Admin
      summary: Get all applicants
      description: Get all applicants (admin only), paginated most-recent-first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: institution
          in: query
          required: false
          schema:
            type: string
        - name: field_of_study
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Applicants retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ApplicantProfile'
                        - type: object
                          properties:
                            registered_at:
                              type: string
                              format: date-time
                            total_applications:
                              type: integer
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /activity-logs:
    get:
      tags:
        - Admin
      summary: Get activity logs
      description: >-
        Get the audit activity logs (admin only), paginated most-recent-first.
        Supports the leazi filter contract: exact / not-equal / contains /
        starts-with / ends-with matches on activity_type, status and role
        filters, and created_at range bounds. The search parameter matches the
        description case-insensitively and encrypted PII (username/email) by
        exact SHA-256 hash.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: activity_type
          in: query
          required: false
          description: Exact match on activity type
          schema:
            type: string
        - name: activity_type_neq
          in: query
          required: false
          description: Exclude an exact activity type
          schema:
            type: string
        - name: activity_type_c
          in: query
          required: false
          description: Activity type contains (case-insensitive)
          schema:
            type: string
        - name: activity_type_sw
          in: query
          required: false
          description: Activity type starts with
          schema:
            type: string
        - name: activity_type_ew
          in: query
          required: false
          description: Activity type ends with
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by log status
          schema:
            type: string
            enum: [success, failure]
        - name: status_neq
          in: query
          required: false
          description: Exclude a log status
          schema:
            type: string
            enum: [success, failure]
        - name: user_id
          in: query
          required: false
          description: Filter by the acting user id
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: Filter by the acting user's role
          schema:
            type: string
            enum: [applicant, admin]
        - name: created_at
          in: query
          required: false
          description: Exact created_at match (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
        - name: created_after
          in: query
          required: false
          description: Lower bound on created_at (inclusive)
          schema:
            type: string
        - name: created_before
          in: query
          required: false
          description: Upper bound on created_at (inclusive)
          schema:
            type: string
      responses:
        '200':
          description: Activity logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prices:
    get:
      tags:
        - Public
      summary: List prices by course and period
      description: >-
        Admin-set prices (no login). Paginated; filter with department,
        specialization and duration_months. A course and period with no row uses
        the default of 200000 RWF per month (see /prices/quote).
      security: []
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 100}}
        - {name: department, in: query, schema: {type: string, enum: [software, iot]}}
        - {name: specialization, in: query, schema: {type: string}}
        - {name: duration_months, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Prices retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Price'
    put:
      tags:
        - Settings
      summary: Set the price of a course for a period (admin)
      description: >-
        Admin only. Creates the price, or replaces it when that specialization
        and duration_months already have one. price is the total for the period.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Price'
      responses:
        '200':
          description: Price saved
        '400':
          description: Validation error (e.g. specialization not in the department)
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /prices/quote:
    get:
      tags:
        - Public
      summary: Price for a course and period
      description: >-
        The admin-set price, or 200000 x duration_months when none is set
        (is_default is true then). The application amount is calculated the same way.
      security: []
      parameters:
        - {name: specialization, in: query, required: true, schema: {type: string, example: backend}}
        - {name: duration_months, in: query, required: true, schema: {type: integer, example: 3}}
      responses:
        '200':
          description: Price retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      specialization: {type: string}
                      duration_months: {type: integer}
                      price: {type: number, example: 600000}
                      currency: {type: string, example: RWF}
                      is_default: {type: boolean}
        '400':
          description: Missing or invalid specialization or duration_months

  /prices/{id}:
    delete:
      tags:
        - Settings
      summary: Remove a price (admin)
      description: That course and period then use the default price.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Price deleted
        '404':
          description: Price not found

  /settings/public:
    get:
      tags:
        - Public
      summary: Get intake status
      description: >-
        Whether applications are currently accepted (no login required).
        applications_open is the effective state: it is false once close_on has
        passed. When closed, closure_message is always set.
      security: []
      responses:
        '200':
          description: Settings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      applications_open:
                        type: boolean
                      close_on:
                        type: string
                        description: RFC 3339 timestamp, or empty when no closing date is set
                      closure_message:
                        type: string
  /settings:
    get:
      tags:
        - Admin
      summary: Get settings
      description: Get application settings (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      application_open:
                        type: boolean
                      max_applications_per_user:
                        type: integer
                      notification_email:
                        type: string
                        format: email
    put:
      tags:
        - Admin
      summary: Update settings
      description: Update application settings (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_open:
                  type: boolean
                max_applications_per_user:
                  type: integer
                notification_email:
                  type: string
                  format: email
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      application_open:
                        type: boolean
                      max_applications_per_user:
                        type: integer
                      notification_email:
                        type: string
                        format: email

  /sessions/bookings:
    get:
      tags:
        - Sessions
      summary: Get session bookings
      description: >-
        Booked on-site/hybrid seats per start date, duration and session for
        internships that haven't ended yet (6 seats per session), paginated.
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: Bookings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  meta:
                    type: object
                    description: Pagination (total, page, limit, pages)
