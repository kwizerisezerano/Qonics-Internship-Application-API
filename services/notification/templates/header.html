{{define "header"}}

<!-- Logo Section -->
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center" style="padding: 30px 15px;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                    <td align="center" style="padding-bottom: 22px;">
                        {{if .LogoUrl}}
                        <img src="{{.LogoUrl}}" alt="Qonics" width="150" height="50" style="display: block; max-width: 150px; width: 100%; height: auto;" />
                        {{else}}
                        <span style="display: inline-block; font-family: Montserrat, Arial, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #28a745;">QONICS</span>
                        {{end}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

{{end}}
