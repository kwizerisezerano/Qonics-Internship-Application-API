{{define "header"}}

<!-- Logo Section -->
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center" style="padding: 30px 15px;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                    <td align="center" style="padding-bottom: 22px;">
                        {{if .LogoUrl}}
                        <img src="{{.LogoUrl}}" alt="Qonics" width="150" height="50" style="display: block; max-width: 150px; width: 100%; height: auto;" />
                        {{else}}
                        <img src="https://res.cloudinary.com/danzeqybu/image/upload/v1795014256/WhatsApp_Image_2026-11-18_at_5.02.48_PM_rudk0a.jpg" alt="Qonics" width="150" height="50" style="display: block; max-width: 150px; width: 100%; height: auto;" />
                        {{end}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

{{end}}
