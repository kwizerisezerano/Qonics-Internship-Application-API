{{define "footer"}}

<!-- Footer Separator -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 20px;">
    <tr>
        <td style="border-top: 1px solid #e9ecef; padding-top: 20px;">

            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="font-family: Montserrat, Arial, sans-serif;">

                <!-- Copyright -->
                <tr>
                    <td align="center" style="font-size: 10px; color: #4A5568; font-weight: 400; padding: 2px 0;">
                        &copy; Qonics {{.Year}}
                    </td>
                </tr>

                <!-- About -->
                <tr>
                    <td align="center" style="font-size: 10px; color: #4A5568; font-weight: 400; padding: 2px 0;">
                        <span>Do not reply to this message. This mailbox is not monitored.</span>
                    </td>
                </tr>

                <!-- Contact Us Title -->
                <tr>
                    <td align="center" style="font-size: 10px; font-weight: 700; color: #4A5568; padding: 8px 0 4px 0;">
                        Contact Us
                    </td>
                </tr>

                <!-- Email Contact -->
                <tr>
                    <td align="center" style="font-size: 10px; color: #4A5568; font-weight: 400; padding: 1px 0;">
                        <a href="mailto:info@qonics.com" style="color: #4A5568; text-decoration: none;">info@qonics.com</a>
                    </td>
                </tr>

                <!-- Our Offices Title -->
                <tr>
                    <td align="center" style="font-size: 10px; font-weight: 700; color: #4A5568; padding: 8px 0 4px 0;">
                        Our Offices
                    </td>
                </tr>

                <!-- Office Locations -->
                <tr>
                    <td align="center" style="font-size: 10px; color: #4A5568; font-weight: 400; padding: 1px 0;">
                        <a href="https://www.google.com/maps/place/Qonics+Inc/@-1.9298951,30.0679032,17z" target="_blank" rel="noopener noreferrer" style="color: #4A5568; text-decoration: none;">Kigali: KN 8 Ave, Kigali &mdash; Rwanda</a>
                    </td>
                </tr>

                <!-- Bottom Padding -->
                <tr>
                    <td style="padding-bottom: 10px;"></td>
                </tr>

            </table>
        </td>
    </tr>
</table>

{{end}}
